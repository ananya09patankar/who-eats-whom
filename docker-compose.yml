services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wew
      POSTGRES_PASSWORD: wewpass
      POSTGRES_DB: wew
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/neo4jpass"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes: ["neo4jdata:/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
  neo4jdata:
